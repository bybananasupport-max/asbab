# Builds the Asbab Android APK.
# - Pull requests: run tests, build the APK and upload it as an artifact (test APK).
# - Push to main: same, plus a GitHub Release with the APK so it can be downloaded from the phone.
# - Manual: Actions tab > "Bina APK Asbab" > Run workflow.
# - Phase 7.2: pull requests from Asbab's own upgrade branches (asbab/...) also publish the test APK as a
#   pre-release, so the app can offer "Cuba versi ujian". A manual run with "ref" rebuilds an older version
#   with a new version number (Patah balik), because Android cannot install an older version over a newer one.
name: Bina APK Asbab

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Patah balik: tag versi lama untuk dibina semula (contoh v0.1.19). Kosongkan untuk binaan biasa."
        required: false
        default: ""

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    env:
      ASBAB_VERSION_CODE: ${{ github.run_number }}
      ASBAB_VERSION_NAME: 0.1.${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.ASBAB_KEYSTORE_BASE64 != '' && secrets.ASBAB_KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || '' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Copy web app into Android project
        run: npm run build

      - name: Kotlin unit tests (reminders, JAKIM)
        working-directory: app/android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Prepare release keystore (from secrets)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ASBAB_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/asbab.jks"
          echo "ASBAB_KEYSTORE_PATH=$RUNNER_TEMP/asbab.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        working-directory: app/android
        env:
          ASBAB_KEYSTORE_PASSWORD: ${{ secrets.ASBAB_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/asbab-$ASBAB_VERSION_NAME.apk"

      - name: Build debug APK (no keystore secret yet)
        if: env.HAS_KEYSTORE != 'true'
        working-directory: app/android
        run: |
          echo "::warning::Secret ASBAB_KEYSTORE_BASE64 tiada, jadi APK debug dibina. Lihat README untuk tambah keystore."
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/asbab-$ASBAB_VERSION_NAME-debug.apk"

      - name: Remove keystore file
        if: always()
        run: rm -f "$RUNNER_TEMP/asbab.jks"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: asbab-${{ env.ASBAB_VERSION_NAME }}
          path: ${{ runner.temp }}/asbab-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish test APK (Asbab upgrade branches only)
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'asbab/')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh release create "v$ASBAB_VERSION_NAME-ujian" "$RUNNER_TEMP"/asbab-*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$HEAD_SHA" \
            --prerelease \
            --title "Asbab $ASBAB_VERSION_NAME (ujian)" \
            --notes "APK ujian untuk PR #$PR_NUMBER. Bukan versi rasmi: cuba dulu, kemudian lulus atau minta pembetulan dalam Asbab."

      - name: Create GitHub Release (Patah balik)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.ref != ''
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_REF: ${{ github.event.inputs.ref }}
        run: |
          gh release create "v$ASBAB_VERSION_NAME" "$RUNNER_TEMP"/asbab-*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "Asbab $ASBAB_VERSION_NAME (patah balik ke $OLD_REF)" \
            --notes "Kod versi $OLD_REF dibina semula dengan nombor versi baharu supaya boleh dipasang di atas versi sekarang."

      - name: Create GitHub Release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KIND=$([ "$HAS_KEYSTORE" = "true" ] && echo "ditandatangani (release)" || echo "debug")
          gh release create "v$ASBAB_VERSION_NAME" "$RUNNER_TEMP"/asbab-*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Asbab $ASBAB_VERSION_NAME" \
            --notes "APK Asbab versi $ASBAB_VERSION_NAME ($KIND), dibina daripada commit ${GITHUB_SHA::7}. Muat turun fail .apk di bawah dan buka di telefon untuk pasang."
