# One-time helper: creates a release keystore for signing Asbab.
# Run it manually (Actions tab > "Jana keystore Asbab" > Run workflow), download the
# artifact, copy the two values into repository secrets, then DELETE the artifact.
# The keystore is never committed to the repo. See README "Keystore release".
name: Jana keystore Asbab

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate keystore
        run: |
          set -euo pipefail
          umask 077
          OUT="$RUNNER_TEMP/keystore"
          mkdir -p "$OUT"
          PASS="$(openssl rand -base64 30 | tr -dc 'A-Za-z0-9' | head -c 32)"
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore "$OUT/asbab.jks" -alias asbab \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Asbab, O=bybanana, C=MY" > /dev/null 2>&1
          base64 -w 0 "$OUT/asbab.jks" > "$OUT/ASBAB_KEYSTORE_BASE64.txt"
          printf '%s' "$PASS" > "$OUT/ASBAB_KEYSTORE_PASSWORD.txt"
          rm "$OUT/asbab.jks"
          echo "Keystore dijana. Muat turun artifact 'asbab-keystore-PADAM-SELEPAS-GUNA' di bawah."

      - name: Upload (deleted automatically after 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: asbab-keystore-PADAM-SELEPAS-GUNA
          path: ${{ runner.temp }}/keystore/*.txt
          retention-days: 1
